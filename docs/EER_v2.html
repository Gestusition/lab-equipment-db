2" y="710" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#223">Passing a session derives authorizations for every instrument</text><text x="1012" y="728" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#223">the course QUALIFIES_FOR; the trainer becomes the assessor.</text><text x="1012" y="746" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#223">safety_for = hazard class a safety course certifies (NULL for</text><text x="1012" y="764" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#223">operation courses). Hazardous items need a passed safety</text><text x="1012" y="782" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#223">course for their own hazard class, valid for the whole booking.</text><text x="1012" y="800" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#223">Active authorizations of one (trainee, instrument) pair may</text><text x="1012" y="818" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#223">not overlap in time (exclusion constraint).</text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><rect width="100%" height="100%" fill="#fff"/><text x="800.0" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111">Module 4 — BOOKING: reservations, waitlist and usage</text><text x="800.0" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#555">EER v2 · Kıraç Polatkan (230303054) · reservation as the reified ternary BOOKS(person, equipment, project), composite attribute, 1:1 relationship</text><line x1="260" y1="260" x2="530" y2="380" stroke="#333" stroke-width="1.2"/><line x1="801.4422205101856" y1="557.8366692347216" x2="531.4422205101856" y2="377.8366692347216" stroke="#333" stroke-width="1.2"/><line x1="798.5577794898144" y1="562.1633307652784" x2="528
